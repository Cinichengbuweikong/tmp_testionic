ext {
    junitVersion = project.hasProperty('junitVersion') ? rootProject.ext.junitVersion : '4.13.2'
    androidxAppCompatVersion = project.hasProperty('androidxAppCompatVersion') ? rootProject.ext.androidxAppCompatVersion : '1.7.1'
    androidxJunitVersion = project.hasProperty('androidxJunitVersion') ? rootProject.ext.androidxJunitVersion : '1.3.0'
    androidxEspressoCoreVersion = project.hasProperty('androidxEspressoCoreVersion') ? rootProject.ext.androidxEspressoCoreVersion : '3.7.0'
}

buildscript {
    repositories {
        google()
        mavenCentral()
    }
    dependencies {
        classpath 'com.android.tools.build:gradle:8.13.0'
        // Chaquopy：把 CPython 运行时打进这个 library 模块（AAR），宿主 app 无需任何配置
        classpath 'com.chaquo.python:gradle:17.2.0'
    }
}

apply plugin: 'com.android.library'
// 关键实验：Chaquopy 是否能应用在 library 模块上（而不是 app 模块）
apply plugin: 'com.chaquo.python'

chaquopy {
    defaultConfig {
        // 选 3.11 而不是 3.13：Chaquopy 从 3.12 起只支持 64 位 ABI，而 Android 7 时代
        // 还有大量 armeabi-v7a 设备。3.11 是"能覆盖 32 位 + 足够新"的折中。
        version = '3.11'
        // 构建期 pip（C 扩展包也只能这样装）。需要本机有同版本 Python（3.11）：
        //   buildPython '/usr/bin/python3.11'      // Windows: 'C:\\Python311\\python.exe'
        //   pip { install 'requests' }             // 纯 Python
        //   pip { install 'numpy' }                // 需要 chaquo.com/pypi 的 Android wheel
        // 运行时可以用 installWheels() 装纯 Python wheel（已验证 six 1.17.0）。
    }
}

android {
    namespace = "com.testionic.python"
    compileSdk = project.hasProperty('compileSdkVersion') ? rootProject.ext.compileSdkVersion : 36
    defaultConfig {
        minSdkVersion project.hasProperty('minSdkVersion') ? rootProject.ext.minSdkVersion : 24
        targetSdkVersion project.hasProperty('targetSdkVersion') ? rootProject.ext.targetSdkVersion : 36
        versionCode 1
        versionName "1.0"
        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"
        // Chaquopy 在 library 模块里必须显式声明 ABI（它没法像 app 模块那样自动推断）
        ndk {
            abiFilters 'arm64-v8a', 'armeabi-v7a', 'x86_64'
        }
    }
    buildTypes {
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }
    lintOptions {
        abortOnError = false
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_21
        targetCompatibility JavaVersion.VERSION_21
    }
}

repositories {
    google()
    mavenCentral()
}

dependencies {
    implementation fileTree(dir: 'libs', include: ['*.jar'])
    implementation project(':capacitor-android')
    implementation "androidx.appcompat:appcompat:$androidxAppCompatVersion"
    testImplementation "junit:junit:$junitVersion"
    androidTestImplementation "androidx.test.ext:junit:$androidxJunitVersion"
    androidTestImplementation "androidx.test.espresso:espresso-core:$androidxEspressoCoreVersion"
}
