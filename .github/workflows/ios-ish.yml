name: build iSH-ARM64 engine (iOS)

# 只在手动触发：这个 job 会 clone 并编译 iSH-ARM64（几十万行 C，meson + ninja），
# 要 20~40 分钟，不适合每次 push 都跑。
#
# 用途：给 capacitor-linux 的 iOS 侧产出 ios/CapISH.xcframework。
# 产物作为 artifact 上传，下载后放进插件目录即可（见脚本末尾说明）。
#
# 失败时不需要 token 拉日志：脚本会把关键行抛成 ::error:: annotation，
# 公开的 check-runs/<jobId>/annotations 接口就能读到。
on:
  workflow_dispatch:
    inputs:
      ish_commit:
        description: 'dsh-ios 的 commit/tag（默认 HEAD）'
        required: false
        default: 'HEAD'
  # 改构建脚本或 boot 代码时自动重跑（迭代阶段省一次手动点击）；平时不会因普通提交触发。
  push:
    paths:
      - 'plugins/capacitor-linux/scripts/fetch-ish-ios-runtime.sh'
      - 'plugins/capacitor-linux/scripts/vm/capish-boot-ios.c'
      - 'plugins/capacitor-linux/ios/Sources/CapISHBridge/**'
      - '.github/workflows/ios-ish.yml'

jobs:
  build-ish:
    runs-on: macos-15
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4

      - name: Show toolchain
        run: |
          xcodebuild -version
          xcrun --sdk iphoneos --show-sdk-version
          python3 --version
          meson --version || true
          ninja --version || true

      - name: Build CapISH.xcframework
        env:
          ISH_COMMIT: ${{ inputs.ish_commit }}
          ISH_DEBUG: '1'
        run: |
          set +e
          bash plugins/capacitor-linux/scripts/fetch-ish-ios-runtime.sh 2>&1 | tee build-ish.log
          rc=${PIPESTATUS[0]}
          echo "build rc=$rc  log-lines=$(wc -l < build-ish.log)"
          if [ "$rc" -ne 0 ]; then
            # 关键：把日志塞进 annotation，这样公开 API（check-runs/<jobId>/annotations）
            # 就能读到，不需要 token 拉 job 日志。
            echo "::error::rc=$rc pwd=$(pwd) scripts=$(ls plugins/capacitor-linux/scripts | tr '\n' ' ')"
            echo "::error::bash=$(bash --version | head -1)"
            n=0
            while IFS= read -r line; do
              n=$((n+1))
              [ "$n" -gt 8 ] && break
              echo "::error::HEAD|$line"
            done < build-ish.log
            n=0
            tail -n 8 build-ish.log | while IFS= read -r line; do
              echo "::error::TAIL|$line"
            done
          fi
          exit "$rc"

      - name: Summarise artifact
        if: always()
        run: |
          echo "## iSH-ARM64 build" >> "$GITHUB_STEP_SUMMARY"
          if [ -d plugins/capacitor-linux/ios/CapISH.xcframework ]; then
            echo "✅ xcframework 生成成功" >> "$GITHUB_STEP_SUMMARY"
            du -sh plugins/capacitor-linux/ios/CapISH.xcframework >> "$GITHUB_STEP_SUMMARY"
            find plugins/capacitor-linux/ios/CapISH.xcframework -maxdepth 2 >> "$GITHUB_STEP_SUMMARY"
          else
            echo "❌ 没有产物（看上面 ::error:: 注解）" >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: Upload xcframework
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: CapISH-xcframework
          path: |
            plugins/capacitor-linux/ios/CapISH.xcframework
            plugins/capacitor-linux/ios/ish-headers
            build-ish.log
          if-no-files-found: warn
          retention-days: 14
